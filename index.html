<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>TASK MANAGER</title>
  <link rel="stylesheet" href="css/styles.css">
  <!-- Aplica o tema antes do primeiro desenho, evitando "piscar" claro → escuro. -->
  <script>
    try { document.documentElement.dataset.theme = localStorage.getItem('theme') || 'light'; }
    catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>
  <header id="top"></header>
  <nav id="nav"></nav>

  <main id="app"><p class="muted">Carregando…</p></main>

  <!-- Fundo escuro das gavetas laterais -->
  <div id="ov"></div>

  <!-- Gaveta: notificações -->
  <aside id="pn" class="drawer" aria-label="Notificações">
    <div class="row between drawer-head"><b>Notificações</b><button class="small" id="pnx" aria-label="Fechar">✕</button></div>
    <div id="pnb" class="drawer-body"></div>
  </aside>

  <!-- Gaveta: menu -->
  <aside id="mn" class="drawer" aria-label="Menu">
    <div class="row between drawer-head"><b>Menu</b><button class="small" id="mnx" aria-label="Fechar">✕</button></div>
    <div id="mn_b" class="drawer-body"></div>
  </aside>

  <!-- Modal reutilizável -->
  <div id="md" class="modal"><div class="modal-box" id="mdb" role="dialog" aria-modal="true"></div></div>

  <button id="nfab" class="fab" aria-label="Nova tarefa">+</button>
  <div id="pops"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <!-- Back-end: config escolhe Supabase (padrão) ou local; só o escolhido se ativa. -->
  <script src="js/runtime/config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
  <script src="js/runtime/supabase-runtime.js"></script>
  <script src="js/runtime/local-runtime.js"></script>

  <!-- Ordem importa: cada arquivo usa o que foi definido nos anteriores. -->
  <script src="js/core/utils.js"></script>
  <script src="js/core/constants.js"></script>
  <script src="js/core/state.js"></script>

  <script src="js/domain/schedule.js"></script>
  <script src="js/domain/tasks.js"></script>
  <script src="js/domain/devices.js"></script>
  <script src="js/domain/layout.js"></script>
  <script src="js/domain/auth.js"></script>

  <script src="js/views/components.js"></script>
  <script src="js/views/layout.js"></script>
  <script src="js/views/agenda.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/team.js"></script>
  <script src="js/views/devices.js"></script>
  <script src="js/views/account.js"></script>
  <script src="js/views/notifications.js"></script>
  <script src="js/views/tutorials.js"></script>
  <script src="js/views/modals.js"></script>

  <script src="js/app/render.js"></script>
  <script src="js/app/actions.js"></script>
  <script src="js/app/drag.js"></script>
  <script src="js/app/device-drag.js"></script>
  <script src="js/app/events.js"></script>
  <script src="js/app/main.js"></script>
</body>
</html>
