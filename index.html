<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TASK MANAGER</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);color-scheme:light;--bg:#f1f1f1;--card:#fff;--tx:#161616;--mu:#6a6a6a;--bd:#dedede;--ac:#262626;--acx:#fff;--ac2:#ececec;--fr:#f6f6f6;--al:#dc2626;--ne:#d97706;--ba:#2f9e6b}
:root[data-theme=dark]{color-scheme:dark;--bg:#0a0a0a;--card:#141414;--tx:#eaeaea;--mu:#8e8e8e;--bd:#262626;--ac:#d6d6d6;--acx:#0a0a0a;--ac2:#1f1f1f;--fr:#101010;--al:#ef4444;--ne:#f59e0b;--ba:#34b97d}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:calc(72px + env(safe-area-inset-bottom,0px))}
main{max-width:760px;margin:0 auto;padding:14px}
h1{font-size:19px;margin:0 0 12px}h2{font-size:16px;margin:16px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{justify-content:space-between}
.mu{color:var(--mu);font-size:13px}
input,select,textarea,button{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;max-width:100%}
textarea{width:100%;resize:vertical}input[type=text],input[type=number],input[type=datetime-local],input[type=time],input[type=date],select{width:100%}
label{display:block;font-size:13px;color:var(--mu);margin:10px 0 4px}
button{cursor:pointer}button.p{background:var(--ac);color:var(--acx);border-color:var(--ac)}button.s{padding:6px 10px;font-size:13px}button.d{color:var(--al)}
.tag{display:inline-block;font-size:11px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd);color:var(--mu)}
.alta{border-left:4px solid var(--al)}.neutra{border-left:4px solid var(--ne)}.baixa{border-left:4px solid var(--ba)}
.free{background:var(--fr);border-style:dashed;color:var(--mu)}.off{opacity:.7;background:var(--ac2)}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;border:0;border-radius:0;background:none;padding:12px 4px;font-size:12px;color:var(--mu)}nav button.on{color:var(--ac);font-weight:600}
.b{background:var(--al);color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:3px}
.hist{font-size:12px;color:var(--mu);margin-top:6px;padding-left:14px}
body{padding-top:calc(56px + env(safe-area-inset-top,0px))}
#top{position:fixed;top:0;left:0;right:0;height:calc(48px + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 10px 0 16px;background:var(--card);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;z-index:6}#top:empty{display:none}
#bell{color:var(--tx)}
.slot{padding:8px 12px;margin-bottom:4px}.slot.hot{outline:2px solid var(--ac);background:var(--ac2);color:var(--tx)}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}.strip .card{min-width:230px;max-width:260px;flex:0 0 auto;margin-bottom:0}
.dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;padding:10px 8px;margin:-4px -4px 6px;border-radius:8px;background:var(--ac2)}.card.sel{outline:2px solid var(--ac)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:middle}
.md{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}.md.open{display:flex}.mb{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;width:min(440px,100%);max-height:90vh;overflow:auto}
.ghost{position:fixed;z-index:30;pointer-events:none;opacity:.92;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:260px;margin:0}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:99px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:40}
#ov{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}#ov.open{opacity:1;pointer-events:auto}
#pn{position:fixed;top:0;right:0;bottom:0;width:min(340px,92vw);background:var(--bg);border-left:1px solid var(--bd);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#pn.open{transform:none}#pnb{padding:12px;overflow:auto;flex:1}
@media(min-width:900px){nav{top:calc(48px + env(safe-area-inset-top,0px));bottom:auto;border-top:0;border-bottom:1px solid var(--bd);justify-content:center}nav button{flex:0 0 120px}body{padding-top:calc(104px + env(safe-area-inset-top,0px));padding-bottom:0}}
#mn{position:fixed;top:0;right:0;bottom:0;width:min(320px,92vw);background:var(--bg);border-left:1px solid var(--bd);z-index:10;display:flex;flex-direction:column;transform:translateX(100%);transition:transform .22s;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}#mn.open{transform:none}#mn_b{overflow:auto;flex:1}.mi{width:100%;text-align:left;padding:12px 14px}
html{background:var(--bg)}
.card{border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.05)}:root[data-theme=dark] .card{box-shadow:none}
button{transition:background .15s,border-color .15s}button:not(.p):hover{background:var(--ac2)}
.tag{background:var(--ac2);color:var(--tx)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--ac);outline-offset:0;border-color:var(--ac)}
nav button.on{box-shadow:inset 0 2px 0 var(--ac)}
h1{letter-spacing:.3px}
.nd{flex:none;width:10px;height:10px;border-radius:50%;background:var(--mu)}.nd.g{background:var(--ba)}.nd.r{background:var(--al)}.nd.y{background:var(--ne)}
.nt{display:flex;gap:12px;align-items:flex-start;padding:12px;margin-bottom:8px;border-radius:14px;background:var(--card);border:1px solid var(--bd)}.nt.new{border-color:var(--ac)}.nt .nd{margin-top:5px}
.nt .tx{flex:1;min-width:0;line-height:1.35}.nt .tm{font-size:12px;color:var(--mu);margin-top:3px}
.nt .nw{font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--acx);background:var(--ac);border-radius:99px;padding:2px 8px}
#pops{position:fixed;right:14px;bottom:calc(152px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px;z-index:60;pointer-events:none;align-items:flex-end}
.pop{width:min(300px,86vw);display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;border:1px solid color-mix(in srgb,var(--bd) 70%,transparent);background:color-mix(in srgb,var(--card) 78%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 8px 28px rgba(0,0,0,.22);font-size:13px;animation:pin .28s cubic-bezier(.2,.8,.2,1)}
.pop.out{animation:pout .32s ease-in forwards}.pop .nd{margin-top:5px}
@keyframes pin{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes pout{to{opacity:0;transform:translateX(40px) scale(.96)}}
@media(min-width:900px){#pops{bottom:92px}}
.dvg{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}.dvc{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px 14px;text-align:center}.dvn{font-weight:800;font-size:19px;text-transform:uppercase;letter-spacing:.5px}.dvi{height:110px;display:flex;align-items:center;justify-content:center;margin:12px 0}.dvp{font-weight:700;font-size:17px}.dvs{color:var(--mu);font-weight:600;margin-top:4px}.dvd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-left:6px}
.fab{position:fixed;right:16px;bottom:calc(84px + env(safe-area-inset-bottom,0px));width:56px;height:56px;border-radius:50%;background:var(--ac);color:var(--acx);border:0;font-size:32px;line-height:1;padding:0 0 3px;display:none;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.3);z-index:8}
@media(min-width:900px){.fab{bottom:24px}}
.mb.wide{width:min(680px,100%)}
</style><script src="local-runtime.js"></script>
<script>try{document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'}catch(e){document.documentElement.dataset.theme='light'}</script></head><body>
<header id="top"></header><nav id="nav"></nav><div id="ov"></div><aside id="pn"><div class="row sp" style="padding:12px 14px;border-bottom:1px solid var(--bd)"><b>Notificações</b><button class="s" id="pnx">✕</button></div><div id="pnb"></div></aside><aside id="mn"><div class="row sp" style="padding:12px 14px;border-bottom:1px solid var(--bd)"><b>Menu</b><button class="s" id="mnx">✕</button></div><div id="mn_b"></div></aside><div id="md" class="md"><div class="mb" id="mdb"></div></div><button id="nfab" class="fab" aria-label="Nova tarefa">+</button><div id="pops"></div><div id="toast"></div><main id="app"><p class="mu">Carregando…</p></main>
<script>
const $=s=>document.querySelector(s),M=60000,DAY=864e5;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PR_={alta:0,neutra:1,baixa:2},PL={alta:'Alta',neutra:'Neutra',baixa:'Baixa'};
const SL={aguardando:'Aguardando aceite',pendente:'Pendente',agendada:'Agendada',andamento:'Em andamento',pausada:'Pausada',concluida:'Concluída',cancelada:'Cancelada'};
const hm=m=>new Date(m).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
const dm=m=>new Date(m).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});
const sod=m=>{const d=new Date(m);d.setHours(0,0,0,0);return d.getTime()};
const addD=(m,n)=>{const d=new Date(m);d.setDate(d.getDate()+n);return d.getTime()};
const at=(d,t)=>{const[h,mi]=t.split(':'),x=new Date(d);x.setHours(+h,+mi,0,0);return x.getTime()};
let db,me=null,PF={},T={},N=[],tab='agenda',selEmp=null,day=sod(Date.now()),prop=null,openH={},flash='';
const WK=()=>{const n=new Date(),mon=addD(sod(n),-((n.getDay()+6)%7));return{s:Math.max(mon,new Date(n.getFullYear(),n.getMonth(),1).getTime()),e:Math.min(addD(mon,7),new Date(n.getFullYear(),n.getMonth()+1,1).getTime())}};
const DEF={start:'08:00',end:'17:00',bs:'12:00',be:'13:00',off:[]};
const prof=id=>({...DEF,...(PF[id]||{})});
const wkOff=(p,ms)=>(p.wk||[]).includes(new Date(ms).getDay());
const busyOf=(emp,ex)=>Object.values(T).filter(t=>t.emp===emp&&t.id!==ex&&t.start&&['agendada','andamento','pausada'].includes(t.status)).map(t=>({s:t.start,e:t.start+t.dur*M}));
function findSlot(p,busy,dur,from){
  from=Math.ceil(from/(15*M))*15*M;
  for(let d=sod(from);d<WK().e;d=addD(d,1)){
    if(wkOff(p,d))continue;const ws=at(d,p.start),we=at(d,p.end);
    const bl=[...busy,...(p.off||[]),{s:at(d,p.bs),e:at(d,p.be)}].filter(b=>b.e>ws&&b.s<we).sort((a,b)=>a.s-b.s);
    let c=Math.max(ws,from);
    for(const b of bl){if(b.s-c>=dur*M)return c;c=Math.max(c,b.e)}
    if(we-c>=dur*M)return c;
  }return null;
}
async function note(to,txt){try{await db.collection('notifs').doc().set({to,txt,at:Date.now()})}catch(e){}}
async function commit(id,patch,x){const o=T[id]||{};await db.doc('tasks/'+id).update({...patch,hist:[...(o.hist||[]),{t:Date.now(),x}]})}
async function tryPending(emp){
  const p=prof(emp),busy=busyOf(emp);
  const list=Object.values(T).filter(t=>t.emp===emp&&t.status==='pendente'&&t.dur).sort((a,b)=>PR_[a.prio]-PR_[b.prio]||a.created-b.created);
  for(const t of list){
    const s=findSlot(p,busy,t.dur,Math.max(Date.now(),t.want||0));
    if(s){busy.push({s,e:s+t.dur*M});await commit(t.id,{status:'agendada',start:s,initial:t.initial||s},'Agendada para '+dm(s)+' '+hm(s));
      note(t.req,'Tarefa “'+t.title+'” agendada: '+dm(s)+' '+hm(s))}
  }
}
async function createTasks(f){
  for(const emp of f.emps){
    const ref=db.collection('tasks').doc(),t={id:ref.id,title:f.title,desc:f.desc,prio:f.prio,dur:null,...(f.link||{}),emp,req:me.id,status:'pendente',created:Date.now(),want:f.want||0,start:null,initial:null,hist:[{t:Date.now(),x:'Tarefa criada'}]};
    t.status='aguardando';t.hist.push({t:Date.now(),x:'Enviada ao funcionário para aceite'});
    note(emp,'Nova tarefa '+PL[f.prio].toLowerCase()+' para aceitar: “'+f.title+'”');
    await ref.set(t);
  }
}
async function act(id,a,sm){
  const t=T[id];
  if(a==='iniciar'||a==='retomar'){if(Object.values(T).some(o=>o.emp===t.emp&&o.id!==id&&o.status==='andamento'))return say('Já há uma tarefa em andamento. Pause ou conclua antes de iniciar outra.')}
  if(a==='iniciar'&&t.start&&t.start>Date.now()+M){
    const n=Date.now(),e=n+t.dur*M;
    if(Object.values(T).some(o=>o.emp===t.emp&&o.id!==id&&o.status==='pausada'&&o.start<e&&o.start+o.dur*M>n))return say('Esse horário conflita com uma tarefa pausada.');
    for(const o of Object.values(T).filter(o=>o.emp===t.emp&&o.id!==id&&o.status==='agendada'&&o.start<e&&o.start+o.dur*M>n)){await commit(o.id,{status:'pendente',start:null},'Reagendamento necessário (outra tarefa foi iniciada antes)');note(o.req,'Tarefa “'+o.title+'” será reagendada')}
    await commit(id,{status:'andamento',start:n,startedAt:n,initial:t.initial||t.start},'Iniciada antes do previsto ('+hm(n)+'; previsto '+hm(t.start)+')');
    note(t.req,'Tarefa “'+t.title+'” iniciada');await tryPending(t.emp);return}
  if(a==='aceitar'){if(!t.dur)return say('Defina a duração antes.');const s=findSlot(prof(t.emp),busyOf(t.emp,id),t.dur,Math.max(Date.now(),t.want||0));
    if(s){await commit(id,{status:'agendada',start:s,initial:s},'Aceita e agendada para '+dm(s)+' '+hm(s));note(t.req,'Tarefa “'+t.title+'” aceita e agendada: '+dm(s)+' '+hm(s))}
    else{await commit(id,{status:'pendente'},'Aceita, sem horário livre nesta semana');note(t.req,'Tarefa “'+t.title+'” aceita, mas sem horário livre nesta semana — pendente')}
    return}
  const m={recusar:['cancelada','Recusada'],iniciar:['andamento','Iniciada'],pausar:['pausada','Pausada'],retomar:['andamento','Retomada'],concluir:['concluida','Concluída'],cancelar:['cancelada','Cancelada']}[a];
  if(!m)return;let ex={},hx='';
  if(a==='concluir'&&t.status==='andamento'&&t.start){const el=Math.max(1,Math.ceil((Date.now()-(t.startedAt||t.start))/M));if(el<t.dur){ex={dur:el,planDur:t.dur};hx=' antes do previsto ('+el+' de '+t.dur+' min)'}}
  await commit(id,{status:m[0],...ex,...(a==='iniciar'?{startedAt:Date.now()}:{}),...(a==='concluir'&&sm?{summary:sm}:{})},m[1]+hx+(a==='concluir'&&sm?' — resumo: '+sm:''));
  if(a==='concluir'&&t.dev)await devLog(t.dev,'Manutenção concluída: “'+t.title+'” (pedida por '+(PF[t.req]?.name||'—')+')'+(sm?' — Relato: '+sm:' — sem relato'));
  if(['concluir','cancelar','recusar'].includes(a)){note(t.req,'Tarefa “'+t.title+'”: '+m[1].toLowerCase()+(a==='concluir'&&sm?' — '+sm.slice(0,120):''));await tryPending(t.emp)}
  else if(a==='iniciar')note(t.req,'Tarefa “'+t.title+'” iniciada');
}
async function chDur(id,dl){
  const t=T[id],nd=Math.max(15,t.dur+dl);if(nd===t.dur)return;
  await commit(id,{dur:nd},'Duração: '+t.dur+' → '+nd+' min');
  if(t.start){const e=t.start+nd*M;
    for(const o of Object.values(T).filter(o=>o.emp===t.emp&&o.id!==id&&o.status==='agendada'&&o.start>=t.start&&o.start<e))
      {await commit(o.id,{status:'pendente',start:null},'Reagendamento necessário (duração de outra tarefa mudou)');note(o.req,'Tarefa “'+o.title+'” será reagendada')}
    await tryPending(t.emp)}
}
function mkProposal(emp){
  const p=prof(emp),busy=Object.values(T).filter(t=>t.emp===emp&&['andamento','pausada'].includes(t.status)&&t.start).map(t=>({s:t.start,e:t.start+t.dur*M}));
  const list=Object.values(T).filter(t=>t.emp===emp&&['agendada','pendente'].includes(t.status)).sort((a,b)=>PR_[a.prio]-PR_[b.prio]||(a.initial||a.created)-(b.initial||b.created));
  return list.map(t=>{const s=findSlot(p,busy,t.dur,Math.max(Date.now(),t.want||0));if(s)busy.push({s,e:s+t.dur*M});return{t,s}});
}
async function applyProp(){
  for(const{t,s}of prop){if(s===t.start)continue;
    await commit(t.id,s?{status:'agendada',start:s,initial:t.initial||s}:{status:'pendente',start:null},s?'Reagendada para '+dm(s)+' '+hm(s):'Sem horário após reorganização');
    note(t.req,s?'Tarefa “'+t.title+'” reagendada: '+dm(s)+' '+hm(s):'Tarefa “'+t.title+'” voltou a pendente')}
  prop=null;render();
}
const devLine=t=>t.dev?'<div class="mu">Aparelho: '+esc(t.devName||'')+(t.devArea?' ('+esc(t.devArea)+')':'')+(t.devIp?' · IP '+esc(t.devIp):'')+(t.preset?' · Tarefa: '+esc(t.preset):'')+'</div>':'';
const stBadge=t=>'<span class="tag">'+SL[t.status]+'</span> <span class="tag">'+PL[t.prio]+'</span>'+(t.dev?' <span class="tag">Manutenção</span>':'');
function taskCard(t,ctl,mask,drag){
  if(mask)return'<div class="card"><b>Ocupado</b> <span class="mu">'+hm(t.start)+'–'+hm(t.start+t.dur*M)+'</span></div>';
  const live=['agendada','andamento','pausada'].includes(t.status),emp=PF[t.emp]?.name||'—',rq=PF[t.req]?.name||'—';
  let b='';
  if(ctl&&['aguardando','pendente'].includes(t.status))b+=durSel(t);
  if(ctl&&t.status==='aguardando')b+='<button class="s p" data-a="aceitar" data-i="'+t.id+'">Agendar automático</button><button class="s d" data-a="recusar" data-i="'+t.id+'">Recusar</button>';
  if(ctl&&live){const s=t.status;
    if(s==='agendada')b+='<button class="s p" data-a="iniciar" data-i="'+t.id+'">Iniciar</button>';
    if(s==='andamento')b+='<button class="s" data-a="pausar" data-i="'+t.id+'">Pausar</button>';
    if(s==='pausada')b+='<button class="s" data-a="retomar" data-i="'+t.id+'">Retomar</button>';
    if(s!=='agendada')b+='<button class="s p" data-a="concluir" data-i="'+t.id+'">Concluir</button>';
    b+='<button class="s" data-d="-15" data-i="'+t.id+'">−15 min</button><button class="s" data-d="15" data-i="'+t.id+'">+15 min</button>'}
  if((ctl||t.req===me.id)&&(live||t.status==='pendente'||(!ctl&&t.status==='aguardando')))b+='<button class="s d" data-a="cancelar" data-i="'+t.id+'">Cancelar</button>';
  if(ctl&&t.preset&&t.devArea&&['aguardando','pendente','agendada','andamento','pausada'].includes(t.status))b+='<button class="s" data-tut="'+esc(t.devArea+'||'+t.preset)+'">Ver tutorial</button>';
  const ch=t.initial&&t.start&&t.initial!==t.start?'<div class="mu">Horário inicial: '+dm(t.initial)+' '+hm(t.initial)+'</div>':'';
  return'<div class="card '+t.prio+'" data-tid="'+t.id+'"><div class="row sp'+(drag&&ctl&&t.status==='agendada'?' dh':'')+'"><b>'+(drag&&ctl&&t.status==='agendada'?'⠿ ':'')+esc(t.title)+'</b><span>'+stBadge(t)+'</span></div>'
   +(t.desc?'<div class="mu">'+esc(t.desc)+'</div>':'')
   +devLine(t)+'<div class="mu">'+(t.start?dm(t.start)+' '+hm(t.start)+'–'+hm(t.start+t.dur*M):'Sem horário')+' · '+(t.dur?t.dur+' min':'duração a definir')+' · '+esc(ctl?'de '+rq:'para '+emp)+'</div>'+ch+(t.summary?'<div class="mu"><b>Resumo:</b> '+esc(t.summary)+'</div>':'')

function empStatus(id){
  const p=prof(id),n=Date.now(),d=sod(n),run=Object.values(T).find(t=>t.emp===id&&t.status==='andamento');
  const R={k:'off',l:'Indisponível',c:'#dc2626'};
  if(run)return{k:'busy',l:'Ocupado',c:'#eab308',x:'Executando: '+run.title};
  const off=(p.off||[]).find(o=>n>=o.s&&n<o.e);
  if(off)return{...R,x:'De folga'+(off.note?' ('+off.note+')':'')+' até '+dm(off.e-1)};
  if(wkOff(p,n))return{...R,x:'Folga semanal'};
  if(n<at(d,p.start)||n>=at(d,p.end))return{...R,x:'Fora do expediente ('+p.start+'–'+p.end+')'};
  if(n>=at(d,p.bs)&&n<at(d,p.be))return{...R,x:'Em intervalo até '+p.be};
  return{k:'free',l:'Disponível',c:'#16a34a',x:'Pode receber tarefas'};
}

async function setDur(id,v){const t=T[id];if(!t)return;if(t.dur&&t.start)return chDur(id,v-t.dur);await commit(id,{dur:v},'Duração definida pelo funcionário: '+v+' min');note(t.req,'Duração de “'+t.title+'”: '+v+' min')}
function fits(t,id,a){const p=prof(t.emp),d=sod(a),ws=at(d,p.start),we=at(d,p.end),e=a+t.dur*M;
  if(a<ws||e>we||a<Date.now()-15*M||wkOff(p,a))return false;
  return![...busyOf(t.emp,id),...(p.off||[]),{s:at(d,p.bs),e:at(d,p.be)}].some(b=>a<b.e&&e>b.s)}
async function drop(id,a){const t=T[id];if(!t)return;if(!t.dur)return say('Defina a duração antes de arrastar.');
  if(!fits(t,id,a))return say('Não cabe nesse horário.');
  const first=t.status!=='agendada';
  await commit(id,{status:'agendada',start:a,initial:t.initial||a},(first?'Agendada':'Movida')+' para '+dm(a)+' '+hm(a));
  note(t.req,'Tarefa “'+t.title+'” '+(first?'agendada':'reagendada')+': '+dm(a)+' '+hm(a));say('Agendada: '+hm(a)+' · '+t.dur+' min')}
function mv(e){dg.x=e.clientX;dg.y=e.clientY;
  if(!dg.moved){if(Math.hypot(dg.x-dg.x0,dg.y-dg.y0)<6)return;dg.moved=true;dg.el.style.opacity=.4;dg.g.style.display=''}
  dg.g.style.left=dg.x-30+'px';dg.g.style.top=dg.y-20+'px';
  document.querySelectorAll('.slot.hot').forEach(x=>x.classList.remove('hot'));
  const el=document.elementFromPoint(dg.x,dg.y)?.closest('.slot');if(el)el.classList.add('hot');dg.o=el}
function endDrag(){const d=dg;dg=null;if(!d)return null;clearInterval(d.tm);d.g.remove();d.el.style.opacity='';document.querySelectorAll('.slot.hot').forEach(x=>x.classList.remove('hot'));return d}

let uid,un=[],authMode='in',authMsg='';
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const sha=async s=>hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)));
async function pw(p,salt){const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(p),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(salt),iterations:150000,hash:'SHA-256'},k,256))}
async function auth(){
  const em=$('#a_e').value.trim().toLowerCase(),ps=$('#a_p').value,bad=m=>{authMsg=m;$('#a_m').textContent=m};
  if(!/^\S+@\S+\.\S+$/.test(em))return bad('Informe um e-mail válido.');
  if(ps.length<6)return bad('A senha precisa ter ao menos 6 caracteres.');
  const id=(await sha(em)).slice(0,24),ref=db.doc('cred/'+id),c=(await ref.get().catch(()=>null))?.data();
  if(authMode==='up'){
    const n=$('#a_n').value.trim();if(!n)return bad('Informe seu nome.');
    if(c)return bad('Este e-mail já está cadastrado.');
    const salt=hex(crypto.getRandomValues(new Uint8Array(16)));
    await ref.set({salt,hash:await pw(ps,salt)});
    await db.doc('profiles/'+id).set({...DEF,name:n,role:$('#a_r').value,seen:0,ck:id,email:em});
  }else if(!c||await pw(ps,c.salt)!==c.hash)return bad('E-mail ou senha incorretos.');
  const aid=(c&&c.aid)||id;if(authMode!=='up')await db.doc('profiles/'+aid).update({ck:id,email:em}).catch(()=>{});
  try{($('#a_k').checked?localStorage:sessionStorage).setItem('aid',aid)}catch(e){}
  authMsg='';start(aid);
}

function start(a){
  uid=a;nSeen=new Set();nInit=false;un.forEach(f=>f());un=[];const er=x=>console.error(x);

    db.collection('tasks').onSnapshot(s=>{T={};s.docs.forEach(x=>T[x.id]=x.data());render()},er),
    db.collection('notifs').where('to','==',uid).onSnapshot(s=>{const arr=s.docs.map(x=>({...x.data(),_id:x.id}));if(nInit)arr.filter(n=>!nSeen.has(n._id)).sort((a,b)=>a.at-b.at).forEach(pop);arr.forEach(n=>nSeen.add(n._id));nInit=true;N=arr;render()},er),
    db.collection('devices').onSnapshot(s=>{DA={};D={};s.docs.forEach(x=>{const v=x.data();DA[x.id]=v;if(v.owner===uid)D[x.id]=v});render()},e=>{er(e);say('Não foi possível carregar os aparelhos.')}),
    db.collection('tutorials').onSnapshot(s=>{TU={};s.docs.forEach(x=>TU[x.id]=x.data());render()},er));
}
(async()=>{
